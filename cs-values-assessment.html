<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Values Assessment | CoachStation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Brand tokens ── */
    :root {
      --purple:       #472456;
      --purple-deep:  #341a3f;
      --purple-mid:   #e8ddef;
      --purple-wash:  #f5f0f7;
      --gold:         #C9A84C;
      --gold-light:   #e2c675;
      --gold-wash:    #fdf8ee;
      --white:        #ffffff;
      --text:         #1e1e1e;
      --text-mid:     #4a4a4a;
      --text-muted:   #7a7a8a;
      --border:       #ddd5e4;
      --border-light: #ede7f2;
      --keep-bg:      #edf7e8;
      --keep:         #3d7a28;
      --reject-bg:    #fdeeed;
      --reject:       #b83228;
      --radius:       10px;
      --radius-lg:    16px;
      --shadow:       0 2px 12px rgba(71,36,86,0.09);
      --shadow-lg:    0 6px 28px rgba(71,36,86,0.15);
    }

    html, body {
      height: 100%;
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--purple-wash);
      color: var(--text);
      font-size: 16px;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ════════════════════════════════
       HEADER
    ════════════════════════════════ */
    .cs-header {
      background: var(--purple);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 16px rgba(0,0,0,0.22);
    }

    .cs-header img.cs-logo {
      height: 48px;
      width: auto;
      display: block;
    }

    .cs-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .cs-stage-badge {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(201,168,76,0.55);
      color: var(--gold-light);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .cs-stage-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .cs-save-note {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }

    /* ════════════════════════════════
       BODY LAYOUT
    ════════════════════════════════ */
    .cs-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* Status bar */
    .cs-statusbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .cs-statusbar-actions {
      position: absolute;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cs-statusbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 20px 0 0;
      margin-right: 20px;
      border-right: 1px solid var(--border-light);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .cs-statusbar-group:last-of-type {
      border-right: none;
      margin-right: 0;
    }

    .cs-statusbar-group strong {
      color: var(--purple);
      font-size: 15px;
    }

    .cs-statusbar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 4px;
    }


    .cs-main {
      flex: 1;
      padding: 32px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cs-main > * {
      width: 100%;
      max-width: 760px;
    }

    /* Mini list used in pass history popover or inline */
    .cs-mini-list {
      list-style: none;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
    }

    .cs-mini-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px dashed var(--border-light);
      color: var(--text-mid);
      gap: 6px;
    }

    .cs-mini-list li .name {
      color: var(--text);
      font-weight: 600;
      flex: 1;
    }

    .tag-keep   { color: var(--keep);   font-size: 11px; font-weight: 600; }
    .tag-reject { color: var(--reject); font-size: 11px; font-weight: 600; }
    .tag-core   { color: var(--gold);   font-size: 11px; font-weight: 700; text-transform: uppercase; }

    .cs-muted {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .cs-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ════════════════════════════════
       BUTTONS
    ════════════════════════════════ */
    button { border: none; cursor: pointer; font: inherit; }

    .btn-primary {
      background: var(--purple);
      color: var(--white);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 13px 28px;
      border-radius: 999px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(71,36,86,0.22);
    }
    .btn-primary:hover { background: #5e2f73; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(71,36,86,0.28); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.32; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-gold {
      background: var(--gold);
      color: var(--white);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 13px 28px;
      border-radius: 999px;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(201,168,76,0.28);
    }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-gold:disabled { opacity: 0.32; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-mid);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
      padding: 10px 20px;
      border-radius: 999px;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .btn-outline:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-wash); }

    .btn-sm {
      background: var(--purple-wash);
      border: 1px solid var(--border);
      color: var(--text-mid);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 11.5px;
      padding: 6px 14px;
      border-radius: 999px;
      transition: background 0.12s;
    }
    .btn-sm:hover { background: var(--purple-mid); }

    .btn-danger {
      background: var(--reject-bg);
      border: 1px solid rgba(184,50,40,0.28);
      color: var(--reject);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 11.5px;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .btn-danger:hover { background: #fbd9d7; }

    .cs-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* ════════════════════════════════
       SECTION HEADINGS
    ════════════════════════════════ */
    .cs-heading {
      margin-bottom: 26px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .cs-heading .bar { display: none; }

    .cs-heading h2 {
      font-size: 26px;
      font-weight: normal;
      color: var(--purple);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .cs-heading p {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* ════════════════════════════════
       CARDS & CONTAINERS
    ════════════════════════════════ */
    .cs-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px 34px;
      box-shadow: var(--shadow);
    }

    .cs-inset {
      background: var(--gold-wash);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 16px 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.7;
    }

    .cs-purple-inset {
      background: var(--purple-wash);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 16px 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.7;
    }

    /* ════════════════════════════════
       WELCOME SCREEN
    ════════════════════════════════ */
    .cs-welcome-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 5px solid var(--purple);
      border-radius: var(--radius-lg);
      padding: 36px 40px 32px;
      box-shadow: var(--shadow-lg);
      max-width: 680px;
    }

    .cs-welcome-card h2 {
      font-size: 28px;
      font-weight: normal;
      color: var(--purple);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .cs-welcome-card .tagline {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
    }

    .cs-welcome-card p {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .cs-welcome-card p:last-of-type {
      margin-bottom: 0;
    }

    .cs-part-block {
      margin: 24px 0;
    }

    .cs-part-label {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
      display: block;
    }

    .cs-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .cs-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14.5px;
      color: var(--text-mid);
      line-height: 1.65;
    }

    .cs-step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--purple);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .cs-notice {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.75;
      margin: 20px 0 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }

    .cs-notice strong { color: var(--purple); }

    /* ════════════════════════════════
       PROGRESS BAR
    ════════════════════════════════ */
    .cs-progress-wrap { margin: 14px 0 6px; }

    .cs-progress-labels {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .cs-progress-track {
      height: 6px;
      background: var(--border-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .cs-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--gold));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* ════════════════════════════════
       VALUE CARD (Discovery sort)
    ════════════════════════════════ */
    .cs-sort-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 20px;
      text-align: center;
    }

    .cs-value-card {
      background: #f7f3ee;
      border-radius: 16px;
      width: 420px;
      min-height: 520px;
      box-shadow: 0 14px 48px rgba(71,36,86,0.22), 0 2px 8px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 28px;
      position: relative;
      overflow: hidden;
    }

    /* Inner border like a playing card */
    .cs-value-card::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1.5px solid rgba(71,36,86,0.18);
      border-radius: 10px;
      pointer-events: none;
    }

    .cs-value-eyebrow {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      opacity: 0.80;
    }

    .cs-value-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 8px;
      width: 100%;
    }

    .cs-value-name {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: normal;
      color: var(--purple);
      margin-bottom: 18px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.2;
      text-align: center;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
      width: 100%;
    }

    .cs-value-divider {
      width: 36px;
      height: 2px;
      background: var(--gold);
      border-radius: 2px;
      margin: 0 auto 18px;
      flex-shrink: 0;
    }

    .cs-value-desc {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--text-mid);
      line-height: 1.65;
      text-align: center;
      margin: 0;
    }

    .cs-value-card-logo {
      width: 228px;
      height: auto;
      opacity: 0.85;
      margin-top: 8px;
    }

    .cs-value-meta {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 15px;
      color: var(--text-mid);
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
    }

    /* Controls below the card */
    .cs-sort-controls {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .cs-choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cs-choice-btn {
      padding: 17px 19px;
      border-radius: var(--radius);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      border: 1.5px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .cs-choice-btn .sub {
      font-size: 13px;
      font-weight: 400;
      opacity: 0.6;
      line-height: 1.4;
    }

    .cs-choice-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .cs-choice-keep {
      background: var(--keep-bg);
      border-color: rgba(61,122,40,0.35);
      color: var(--keep);
    }

    .cs-choice-reject {
      background: var(--reject-bg);
      border-color: rgba(184,50,40,0.35);
      color: var(--reject);
    }

    /* ════════════════════════════════
       ADD FLEX VALUE
    ════════════════════════════════ */
    .cs-add-value-form {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-top: 12px;
      max-width: 580px;
    }

    .cs-add-value-form h4 {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 12px;
    }

    .cs-add-value-form input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 12px;
      font-family: Georgia, serif;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 8px;
      transition: border-color 0.15s;
      box-sizing: border-box;
    }

    .cs-add-value-form input:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* ════════════════════════════════
       PILL GRID (select values)
    ════════════════════════════════ */
    .cs-pill-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 20px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cs-pill {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 13px;
      color: var(--text-mid);
      cursor: pointer;
      transition: all 0.12s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .cs-pill:hover {
      border-color: var(--purple);
      color: var(--purple);
      background: var(--purple-wash);
    }

    .cs-pill.selected {
      background: var(--purple);
      border-color: var(--purple);
      color: var(--white);
    }

    .cs-pill.removable {
      background: var(--purple-wash);
      border-color: var(--border);
      color: var(--text);
    }

    .cs-pill.removable:hover {
      background: var(--reject-bg);
      border-color: rgba(184,50,40,0.4);
      color: var(--reject);
    }

    .cs-pill .rx { opacity: 0.45; font-size: 13px; }
    .cs-pill.removable:hover .rx { opacity: 1; }

    /* ════════════════════════════════
       COUNTER BADGE
    ════════════════════════════════ */
    .cs-counter {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      background: var(--purple-wash);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .cs-counter strong {
      color: var(--purple);
      font-size: 17px;
    }

    /* ════════════════════════════════
       REFLECTION TEXTAREA
    ════════════════════════════════ */
    .cs-reflect label {
      display: block;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cs-reflect textarea {
      width: 100%;
      min-height: 88px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-family: Georgia, serif;
      font-size: 14.5px;
      color: var(--text);
      resize: vertical;
      line-height: 1.6;
    }

    .cs-reflect textarea:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* ════════════════════════════════
       RANK LIST
    ════════════════════════════════ */
    .cs-rank-item {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 7px;
      transition: box-shadow 0.12s;
    }

    .cs-rank-item:hover { box-shadow: var(--shadow); }

    .cs-rank-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--purple);
      color: var(--white);
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cs-rank-name {
      font-size: 15.5px;
      color: var(--text);
      line-height: 1.3;
    }

    .cs-rank-name small {
      display: block;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cs-rank-controls { display: flex; flex-direction: column; gap: 3px; }

    .cs-rank-btn {
      background: var(--purple-wash);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--purple);
      font-size: 11px;
      padding: 3px 9px;
      cursor: pointer;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      transition: background 0.1s;
    }

    .cs-rank-btn:hover { background: var(--purple-mid); }

    /* ════════════════════════════════
       RESULTS
    ════════════════════════════════ */
    .cs-results-hero {
      background: var(--purple);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-lg);
    }

    .cs-results-hero .eyebrow {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .cs-results-hero h2 {
      font-size: 26px;
      font-weight: normal;
      color: var(--white);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .cs-core-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }

    .cs-core-tile {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(201,168,76,0.38);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .cs-core-tile .ct-rank {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 4px;
    }

    .cs-core-tile .ct-name {
      font-size: 15.5px;
      color: var(--white);
      line-height: 1.2;
    }

    .cs-core-tile .ct-desc {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.58);
      margin-top: 4px;
      line-height: 1.45;
    }

    .cs-results-block {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 28px;
      margin-bottom: 16px;
    }

    .cs-results-block h3 {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--purple);
      display: inline-block;
      padding-bottom: 7px;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 14px;
    }

    .cs-p20-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .cs-p20-pill {
      padding: 5px 14px;
      border-radius: 999px;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 12.5px;
      background: var(--purple-wash);
      border: 1px solid var(--border);
      color: var(--text-mid);
    }

    .cs-p20-pill.is-core {
      background: var(--purple);
      border-color: var(--purple);
      color: var(--white);
      font-weight: 700;
    }

    .cs-reflect-display {
      background: var(--purple-wash);
      border-radius: var(--radius);
      padding: 13px 16px;
      font-size: 14.5px;
      color: var(--text-mid);
      line-height: 1.65;
      margin-top: 6px;
    }

    .cs-cta-block {
      background: var(--gold-wash);
      border: 1px solid rgba(201,168,76,0.38);
      border-radius: var(--radius-lg);
      padding: 26px 32px;
      margin-bottom: 16px;
      text-align: center;
    }

    .cs-cta-block h3 {
      font-size: 22px;
      font-weight: normal;
      color: var(--purple);
      margin-bottom: 10px;
    }

    .cs-cta-block p {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14.5px;
      color: var(--text-mid);
      line-height: 1.7;
      margin-bottom: 18px;
      text-align: left;
    }

    /* ════════════════════════════════
       PASS SUMMARY (end of pass)
    ════════════════════════════════ */
    .cs-pass-summary {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 5px solid var(--gold);
      border-radius: var(--radius-lg);
      padding: 28px 32px 26px;
      box-shadow: var(--shadow);
      max-width: 560px;
    }

    .cs-pass-summary h2 {
      font-size: 24px;
      font-weight: normal;
      color: var(--purple);
      margin-bottom: 6px;
    }

    .cs-pass-summary .ps-stat {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      font-size: 14.5px;
      color: var(--text-mid);
      margin-bottom: 12px;
    }

    .cs-pass-summary .ps-stat strong { color: var(--purple); }

    /* Print */
    @media print {
      .cs-header, .cs-statusbar, .cs-action-row { display: none !important; }
      .no-print { display: none !important; }
      html, body { height: auto !important; overflow: visible !important; font-size: 11px; }
      .cs-layout { overflow: visible !important; height: auto !important; }
      .cs-main { overflow: visible !important; height: auto !important; padding: 12px 20px; }
      /* Force cards to 4-column fixed grid for print */
      .cs-print-grid { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; }
      .cs-print-card { break-inside: avoid; min-height: 120px !important; padding: 10px 8px !important; box-shadow: none !important; border: 1px solid #ddd !important; }
      .cs-print-card-inner { font-size: 11px !important; }
      .cs-print-card-name { font-size: 13px !important; margin-bottom: 4px !important; }
      .cs-print-card-divider { margin: 0 auto 4px !important; }
      .cs-print-card-desc { font-size: 10px !important; }
      .cs-cta-block a { display: none !important; }
      /* Page break before category summary */
      .cs-cat-panel { break-before: auto; }
    }
  </style>
</head>

  /* ── Utilities ────────────────────────────────────────── */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function gv(id) { return VALUES.find(v => v.id === id); }

  function getCategory(id) {
    if (!id || id.startsWith('flex_')) return 'My Flex Values';
    const num = parseInt(id.replace('v',''), 10);
    if (num <= 25) return 'Inner Compass';
    if (num <= 50) return 'People and Connection';
    if (num <= 75) return 'Achievement and Growth';
    return 'External Orientation';
  }

  const CATEGORY_ORDER = ['Inner Compass', 'People and Connection', 'Achievement and Growth', 'External Orientation', 'My Flex Values'];
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e) {} }
  function load() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }

  /* ── State ────────────────────────────────────────────── */
  let S;

  function initState() {
    S = {
      stage: 'welcome',
      /* Discovery pass engine */
      passQueue: shuffle(VALUES.map(v => v.id)), // current pass remaining
      passStartCount: VALUES.length, // total values at start of current pass
      passNum: 1,
      passHistory: [],  // [{kept, rejected, passNum}] per completed pass
      kept: [],         // ids surviving so far across all passes
      /* After discovery */
      primary20: [],
      reflP20: '',
      working15: [],
      reflP15: '',
      core10: [],
      reflP10: '',
      removedThisPass: [],
      lastDecision: null
    };
    save();
  }

  /* ── Stage transitions ────────────────────────────────── */
  function go(stage) { S.stage = stage; save(); render(); }

  /* ── Discovery pass handlers ──────────────────────────── */
  function decide(id, action) {
    S.passQueue = S.passQueue.filter(x => x !== id);

    // Store for single-step undo
    S.lastDecision = { id, action };

    if (action === 'keep') {
      if (!S.kept.includes(id)) S.kept.push(id);
    } else {
      S.kept = S.kept.filter(x => x !== id);
      if (!S.removedThisPass.includes(id)) S.removedThisPass.push(id);
    }

    save();

    // Pass queue empty, evaluate final count
    if (S.passQueue.length === 0) {
      const kept = S.kept.length;
      S.passHistory.push({ passNum: S.passNum, keptCount: kept, rejectedThisPass: VALUES.length - kept });
      if (kept === 20) {
        S.primary20 = S.kept.slice();
        go('primary20review');
      } else if (kept < 20) {
        go('under20');
      } else {
        // Still > 20, start next pass on kept values only
        S.passNum++;
        S.passQueue = shuffle(S.kept.slice());
        S.passStartCount = S.kept.length;
        go('passSummary');
      }
    } else {
      render();
    }
  }

  function undoDecision() {
    if (!S.lastDecision) return;
    const { id, action } = S.lastDecision;
    // Put card back at front of queue
    S.passQueue.unshift(id);
    // Reverse the action
    if (action === 'keep') {
      S.kept = S.kept.filter(x => x !== id);
    } else {
      S.removedThisPass = S.removedThisPass.filter(x => x !== id);
      // Don't re-add to kept — it wasn't there before
    }
    S.lastDecision = null;
    save();
    render();
  }

  function startNextPass() {
    S.removedThisPass = [];
    S.lastDecision = null;
    S.passStartCount = S.passQueue.length;
    go('discovery');
  }

  /* ── Primary20 handlers ───────────────────────────────── */
  function handleLock20() {
    S.working15 = S.primary20.slice();
    go('reduce15');
  }

  function handleRemove15(id) {
    S.working15 = S.working15.filter(x => x !== id);
    save(); render();
  }

  function handleRestoreFrom15(id) {
    if (!S.working15.includes(id)) S.working15.push(id);
    save(); render();
  }

  function handleLock15() {
    if (S.working15.length !== 15) return;
    S.core10 = S.working15.slice();
    go('reduce10');
  }

  function handleRemove10(id) {
    S.core10 = S.core10.filter(x => x !== id);
    save(); render();
  }

  function handleRestoreFrom10(id) {
    if (!S.core10.includes(id)) S.core10.push(id);
    save(); render();
  }

  function handleLock10() {
    if (S.core10.length !== 10) return;
    go('rank');
  }

  function moveRank(id, dir) {
    const a = S.core10, i = a.indexOf(id);
    if (i === -1) return;
    if (dir === 'up' && i > 0) [a[i-1],a[i]] = [a[i],a[i-1]];
    if (dir === 'down' && i < a.length-1) [a[i+1],a[i]] = [a[i],a[i+1]];
    save(); render();
  }

  function handleReflect(key, val) { S[key] = val; save(); }

  function handleReset() {
    if (!confirm('Clear all progress and start again? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    initState();
    render();
  }

  function handleCSV() {
    const rows = [['Type','Rank','Name','Description']];
    S.primary20.forEach(id => {
      const v = gv(id);
      const rank = S.core10.indexOf(id);
      // Replace curly apostrophes with straight ones for clean Excel display
      const desc = v.desc.replace(/[\u2018\u2019]/g, "'");
      rows.push([rank >= 0 ? 'Core Value' : 'Primary Value', rank >= 0 ? rank+1 : '', '"'+v.name+'"', '"'+desc+'"']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const a = document.createElement('a');
    // UTF-8 BOM ensures Excel opens with correct encoding
    a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
    a.download = 'coachstation-values.csv';
    a.click();
  }

  function toggleAddValue() {
    const form = document.getElementById('addValueForm');
    if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  function addCustomValue() {
    const nameEl = document.getElementById('customValueName');
    const descEl = document.getElementById('customValueDesc');
    const name = (nameEl ? nameEl.value : '').trim();
    const desc = (descEl ? descEl.value : '').trim() || 'A value that matters deeply to me.';
    if (!name) { alert('Please enter a value name.'); return; }
    if (!S.customValues) S.customValues = [];
    if (S.customValues.length >= 2) return;
    const id = 'flex_' + Date.now();
    VALUES.push({ id, name, desc, custom: true });
    S.customValues.push({ id, name, desc });
    const insertAt = Math.floor(Math.random() * (S.passQueue.length + 1));
    S.passQueue.splice(insertAt, 0, id);
    save();
    render();
  }

  /* ════════════════════════════════
     STAGE: UNDER 20 EDGE CASE
  ════════════════════════════════ */
  function renderUnder20() {
    stageBadge.textContent = 'Too few remaining';
    const kept = S.kept.length;
    const needed = 20 - kept;

    // Compute all values not currently kept
    // Show recently removed ones first (if tracked), then the rest
    const recentIds = S.removedThisPass || [];
    const allRemoved = VALUES.filter(v => !S.kept.includes(v.id));
    const recent  = allRemoved.filter(v => recentIds.includes(v.id));
    const others  = allRemoved.filter(v => !recentIds.includes(v.id));
    const display = [...recent, ...others];

    csMain.innerHTML = `
      <div class="cs-pass-summary">
        <h2>You have ${kept} values remaining</h2>
        <div class="ps-stat">You removed too many in this pass. Restore <strong>${needed} more value${needed !== 1 ? 's' : ''}</strong> to reach your Primary 20.</div>

        <div class="cs-purple-inset">
          Choose ${needed} value${needed !== 1 ? 's' : ''} to bring back from your removed values below. The most recently removed appear first. Click any value to restore it. Once you reach 20, you will continue automatically.
        </div>

        <div class="cs-inset">
          Restoring a value does not mean it is a Core Value. It simply stays in contention for one more pass.
        </div>

        <div style="margin:20px 0;">
          <div style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px;">

          <div style="display:flex; flex-wrap:wrap; gap:8px; max-height:420px; overflow-y:auto; padding-right:4px;">
            ${display.map(v => `

                onmouseover="this.style.background='var(--keep-bg)';this.style.borderColor='rgba(61,122,40,0.4)'"
                onmouseout="this.style.background='var(--white)';this.style.borderColor='var(--border)'">
                <div style="font-family:Georgia,serif; font-size:14.5px; color:var(--purple);">${v.name}</div>
                <div style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:11px; color:var(--text-muted); margin-top:3px; line-height:1.4;">${v.desc}</div>

              </button>`).join('')}
          </div>
        </div>
      </div>`;
  }

  function restoreForUnder20(id) {
    if (!S.kept.includes(id)) S.kept.push(id);
    if (S.removedThisPass) S.removedThisPass = S.removedThisPass.filter(x => x !== id);
    save();
    if (S.kept.length === 20) {
      S.primary20 = S.kept.slice();
      S.passHistory.push({ passNum: S.passNum, keptCount: 20, rejectedThisPass: 0 });
      go('primary20review');
    } else {
      render();
    }
  }

      <!-- Reflection appears only once at exactly 10 -->
      ${done ? `
      <div style="background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px 28px; margin-bottom:20px; box-shadow:var(--shadow);">

        <ul style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:13.5px; color:var(--text-mid); line-height:1.75; padding-left:20px; margin-bottom:18px;">
          <li>Which of these values feel most non-negotiable?</li>
          <li>Which values are most linked to your sense of self?</li>
          <li>Which values, if repeatedly breached, would likely cause frustration, withdrawal or disengagement?</li>
          <li>Which values influence how you lead or work with others?</li>
          <li>Which values do you want to live more intentionally going forward?</li>

          <label>Your reflection (optional):</label>
          <textarea placeholder="Capture your thoughts here..." oninput="handleReflect('reflP10', this.value)">${S.reflP10 || ''}</textarea>
        </div>
      </div>` : ''}

      <div class="cs-btn-row">
        <button class="btn-gold" onclick="handleLock10()" ${!done ? 'disabled' : ''}>These are my Core Values</button>
        <button class="btn-outline" onclick="go('reduce15')">Back to 15</button>
      </div>`;
  }

  /* ════════════════════════════════
     STAGE: RANK + RESULTS
  ════════════════════════════════ */
  let _dragId = null;

  function onRankDragStart(e, id) {
    _dragId = id;
    e.dataTransfer.effectAllowed = 'move';
    e.target.style.opacity = '0.45';
  }

  function onRankDragEnd(e) {
    e.target.style.opacity = '1';
    document.querySelectorAll('.rank-card').forEach(el => {
      el.style.borderTop = '';
      el.style.transform = '';
    });
  }

  function onRankDragOver(e, id) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (_dragId && _dragId !== id) {
      document.querySelectorAll('.rank-card').forEach(el => {
        el.style.borderTop = el.dataset.id === id ? '3px solid var(--gold)' : '';
      });
    }
  }

  function onRankDrop(e, targetId) {
    e.preventDefault();
    if (!_dragId || _dragId === targetId) return;
    const arr = S.core10.slice();
    const fromIdx = arr.indexOf(_dragId);
    const toIdx   = arr.indexOf(targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    arr.splice(fromIdx, 1);
    arr.splice(toIdx, 0, _dragId);
    S.core10 = arr;
    _dragId = null;
    save();
    renderRank();
  }

  function renderRank() {
    stageBadge.textContent = 'Rank and Reflect';
    const list = S.core10;

    csMain.innerHTML = `

              onmouseleave="this.style.boxShadow='0 6px 24px rgba(71,36,86,0.13), 0 1px 4px rgba(0,0,0,0.08)';this.style.transform=''">
              <div style="position:absolute; top:10px; left:10px; right:10px; bottom:10px; border:1.5px solid rgba(71,36,86,0.15); border-radius:8px; pointer-events:none;"></div>
              <div style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold); opacity:0.85; z-index:1;">${ordinal}</div>
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px 6px; z-index:1;">

            </div>`;
        }).join('')}

        <button class="btn-gold" style="font-size:18px; padding:18px 40px;" onclick="go('results')">View my results</button>

      </div>`;

  function renderResults() {
    stageBadge.textContent = 'Your Results';
    const core    = S.core10;
    const p20     = S.primary20;
    const working = S.working15 || core;

    const group1115 = working.filter(id => !core.includes(id));
    const group1620 = p20.filter(id => !working.includes(id));

    const ordinals = ['1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH','9TH','10TH','11TH','12TH','13TH','14TH','15TH','16TH','17TH','18TH','19TH','20TH'];

    // Category definitions
    const CATS = [
      { key: 'ic',  label: 'Inner Compass',           colour: '#7B4F8E', light: '#f0e8f4' },
      { key: 'pc',  label: 'People and Connection',    colour: '#3A8A8C', light: '#e6f4f4' },
      { key: 'ag',  label: 'Achievement and Growth',   colour: '#B8860B', light: '#fdf4d8' },
      { key: 'eo',  label: 'External Orientation',     colour: '#3A5F8A', light: '#e6eef6' },
      { key: 'fx',  label: 'Other',                    colour: '#888',    light: '#f4f4f4' }
    ];

    function catKey(id) {
      if (!id || id.startsWith('flex_')) return 'fx';
      const n = parseInt(id.replace('v',''), 10);
      if (n <= 25) return 'ic';
      if (n <= 50) return 'pc';
      if (n <= 75) return 'ag';
      return 'eo';
    }

    function catStyle(id) {
      const cat = CATS.find(c => c.key === catKey(id));
      return cat;
    }

    // Build category counts across all 20
    const catCounts = {};

            </div>

          <div class="cs-print-card" style="background:var(--white); border:1px solid var(--border); border-top:4px solid ${cat.colour} !important; border-radius:14px; box-shadow:0 2px 10px rgba(71,36,86,0.07); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:18px 14px 18px; position:relative; overflow:hidden; min-height:180px;">

            </div>
          </div>`;

    }

    // Category summary: only show rows with values
    const catSummaryRows = CATS
      .filter(c => catCounts[c.key].core.length > 0 || catCounts[c.key].primary.length > 0)
      .map(c => {
        const coreIds   = catCounts[c.key].core;
        const primIds   = catCounts[c.key].primary;
        const allNames  = [...coreIds, ...primIds].map(id => gv(id).name).join(', ');
        const coreCount = coreIds.length;

            ${c.label}

      <!-- Divider: Core Values -->
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <div style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--purple); white-space:nowrap;">Core Values (1-10)</div>

      <!-- Category summary panel -->
      <div class="cs-cat-panel cs-results-block" style="margin-bottom:28px;">
        <h3 style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--purple); display:inline-block; padding-bottom:7px; border-bottom:2px solid var(--gold); margin-bottom:16px;">Category Breakdown</h3>
        <p style="font-family:'Trebuchet MS',Arial,sans-serif; font-size:13px; color:var(--text-muted); margin-bottom:14px; line-height:1.65;">A cluster of values in one category is as meaningful as a broad spread across all four. Your pattern often reveals what drives you at a level that is not always visible day to day.</p>
        <table style="width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;">

              <th style="padding:9px 12px; text-align:center; font-family:'Trebuchet MS',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--purple);">Total</th>

              <th style="padding:9px 12px; text-align:left; font-family:'Trebuchet MS',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--purple);">Values</th>

        <div style="display:flex; flex-direction:column; gap:14px;">
          ${[
            'Would those closest to you recognise these values as consistent and obvious in how you operate day to day?',
            'Score your sense of fulfilment against each Core Value from 1 to 10, where 10 is maximum. What does your average score tell you about where you are right now?',
            'Where are your actions currently out of alignment with your values? What would it take to close that gap?',
            'How will you hold yourself accountable to living and leading in accordance with these values over the next 90 days?'
          ].map((q, i) => `
            <div style="display:flex; gap:14px; align-items:flex-start;">
              <div style="width:28px; height:28px; border-radius:50%; background:var(--purple); color:white; font-family:'Trebuchet MS',Arial,sans-serif; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;">${i+1}</div>

        <p>The values that sat highest in your ranking are most likely to drive your decisions, shape your reactions under pressure, and define what feels meaningful in your leadership and life.</p>
        <p>A conversation with CoachStation can help you understand how these values are showing up right now, where they may be in conflict, and how to lead more intentionally in alignment with them.</p>
        <a href="https://coachstation.com.au/book-leadership-coaching/" target="_blank" style="display:inline-block;background:var(--purple);color:white;font-family:'Trebuchet MS',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;padding:17px 36px;border-radius:999px;box-shadow:0 4px 14px rgba(71,36,86,0.22);">Book Your Free Discovery Conversation</a>
      </div>

      <div class="no-print" style="text-align:center; margin-top:24px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
        <button class="btn-outline" style="font-size:15px; padding:13px 24px;" onclick="go('rank')">Back to ranking</button>
        <button class="btn-primary" style="font-size:15px; padding:13px 24px;" onclick="window.print()">Print summary</button>
        <button class="btn-sm" style="font-size:15px; padding:13px 24px;" onclick="handleCSV()">Download CSV</button>
        <button class="btn-danger" style="font-size:15px; padding:13px 24px;" onclick="handleReset()">Start a new run</button>
      </div>

      <div class="no-print" style="text-align:center; margin-top:16px;">
        <a href="${PDF_URL}" target="_blank" download style="display:inline-flex; align-items:center; gap:8px; font-family:'Trebuchet MS',Arial,sans-serif; font-size:13px; font-weight:700; color:var(--purple); text-decoration:none; border:1.5px solid var(--purple); border-radius:999px; padding:9px 22px; transition:all 0.12s;"
          onmouseover="this.style.background='var(--purple)';this.style.color='white'"
          onmouseout="this.style.background='transparent';this.style.color='var(--purple)'">
          &#8681; Download: Personal Values &amp; Leadership Guide (PDF)
        </a>
      </div>`;
  }

  /* ════════════════════════════════
     STATUS BAR
  ════════════════════════════════ */
  function renderStatusbar() {
    const kept  = S.kept.length;
    const stage = S.stage;
    let html = '';

    // Pass number
    html += `<div class="cs-statusbar-group">
      <span class="cs-statusbar-label">Pass</span>
      <strong>${S.passNum}</strong>
    </div>`;

    // Values kept
    const keptWarning = kept >= 18 && kept < 20 && S.stage === 'discovery'
      ? `<span style="font-family:'Trebuchet MS',Arial,sans-serif;font-size:10px;color:var(--gold);margin-left:4px;">${20 - kept} to go</span>`
      : kept === 20 && S.stage === 'discovery'
      ? `<span style="font-family:'Trebuchet MS',Arial,sans-serif;font-size:10px;color:var(--keep);font-weight:700;margin-left:4px;">✓ 20 reached</span>`
      : '';
    html += `<div class="cs-statusbar-group">
      <span class="cs-statusbar-label">Kept</span>
      <strong>${kept}</strong>${keptWarning}
    </div>`;

    // Pass history (compact)
    if (S.passHistory.length > 0) {
      const summary = S.passHistory.map(p => `Pass ${p.passNum}: ${p.keptCount}`).join('&nbsp;&nbsp;|&nbsp;&nbsp;');
      html += `<div class="cs-statusbar-group">
        <span class="cs-statusbar-label">History</span>
        <span style="font-family:'Trebuchet MS',Arial,sans-serif;font-size:12px;color:var(--text-mid)">${summary}</span>
      </div>`;
    }

    // Primary 20
    if (S.primary20.length > 0) {
      html += `<div class="cs-statusbar-group">
        <span class="cs-statusbar-label">Primary 20</span>
        <strong>${S.primary20.length}</strong>
      </div>`;
    }

    // Core Values
    if (S.core10.length > 0) {
      html += `<div class="cs-statusbar-group">
        <span class="cs-statusbar-label">Core Values</span>
        <strong>${S.core10.length} / 10</strong>
      </div>`;
    }

    // Actions pushed to the right
    html += `<div class="cs-statusbar-actions">
      <button class="btn-sm" onclick="window.print()">Print</button>
      <button class="btn-sm" onclick="handleCSV()">CSV</button>
      <button class="btn-danger" onclick="handleReset()">Reset</button>
    </div>`;

    csStatusbar.innerHTML = html;
  }

  /* ── Init ─────────────────────────────────────────────── */
  (function init() {
    const saved = load();
    if (saved && saved.stage) {
      S = saved;
      // Patch fields added in later versions that may be missing from saved state
      if (!S.removedThisPass) S.removedThisPass = [];
      if (S.lastDecision === undefined) S.lastDecision = null;
    } else {
      initState();
    }
    render();
  })();
</script>
